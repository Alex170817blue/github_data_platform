services:
  prefect-server:
    image: prefecthq/prefect:3.8.5-python3.12
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/root/.prefect
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0

  app:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      - prefect-server

  worker:
    build: .
    command: prefect worker start --pool default-pool
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      - prefect-server

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - prefect-server

  dashboard:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./dashboard:/app
      - dashboard-node-modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  prefect-data:
  dashboard-node-modules: